<html>

<head>
    <meta charset="UTF-8">
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black" name="apple-mobile-web-app-status-bar-style" />
    <meta content="telephone=no" name="format-detection" />
    <meta content="email=no" name="format-detection" />
    <meta content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=0"
          name="viewport" />
    <title>&lrm;</title>
    <style type="text/css">
        body {
            transition: opacity 1s ease-out;
            /* 设置透明度变化的过渡效果 */
            opacity: 0;
            /* 初始透明度为0 */
            background-color: transparent;
        }

        /* 暗黑模式样式 */
        [data-theme='dark'] body {
            background-color: #101314;
            /* 暗黑模式背景色 */
        }

        /* 明亮模式样式 */
        [data-theme='light'] body {
            background-color: #FFF;
            /* 明亮模式背景色 */

        }

        .am-page-result {
            text-align: center;
        }

        .am-page-result .am-page-result-pic {
            width: 135px;
            height: 135px;
            margin: 40px auto;
        }

        .am-page-result .am-page-result-pic img {
            width: 100%;
            height: 100%;
        }

        .am-page-result p {
            margin: 0;
            font-weight: 400;
            font-size: 20px;
        }

        /* 明亮模式样式 */
        [data-theme='light'] .am-page-result p {
            color: #999;
        }

        /* 暗黑模式样式 */
        [data-theme='dark'] .am-page-result p {
            color: #fff;
        }

        .am-page-result-button {
            margin-top: 25px;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
        }

        .am-button {
            display: block;
            margin: 0 10px;
            padding: 0 10px;
            height: 42px;
            text-align: center;
            font-size: 18px;
            line-height: 42px;
            border-radius: 4px;
            outline: 0;
            -webkit-appearance: none;
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            flex: 1;
            width: 50%;
        }

        .am-button[am-mode~=white] {
            border: 1px solid #DDD;
            color: #666;
            background-color: #FFF;
        }

        .am-button[am-mode~=white]:active {
            border-color: #D8D8D8;
            background-color: #F8F8F8;
        }

        .am-button[am-mode~=blue] {
            border: 1px solid #28F;
            color: #FFF;
            background-color: #39F;
        }

        .am-button[am-mode~=blue]:active {
            border-color: #17F;
            background-color: #28F;
        }

        .am-button[am-mode~=light],
        .am-button[am-mode~=light]:active {
            border: none;
            color: #39F;
            background-color: #FFF;
        }

        /* 暗黑模式样式 */
        .am-button[am-mode~=dark],
        .am-button[am-mode~=dark]:active {
            border: none;
            color: #D3D5D7;
            background-color: #26272B;
        }

        @media screen and (min-device-width: 375px) {
            .am-page-result .am-page-result-pic {
                width: 160px;
                height: 160px;
                margin: 45px auto;
            }

            .am-page-result-button {
                margin-top: 30px;
            }

            .am-button {
                margin: 0 20px;
                height: 44px;
                line-height: 44px;
            }

            [data-theme='dark'] .am-button .buttonText {
                color: #D3D5D7;
            }
        }

        @media screen and (min-device-width: 414px) {
            .am-page-result .am-page-result-pic {
                width: 180px;
                height: 180px;
                margin: 50px auto;
            }

            .am-button {
                margin: 0 24px;
                height: 50px;
                line-height: 50px;
            }

            [data-theme='dark'] .am-button .buttonText {
                color: #D3D5D7;
                /* 暗黑模式下的文字颜色 */
            }
        }
    </style>

<body>
<div class="am-page-result">
    <div class="am-page-result-pic">
        <img id="img" alt="" />
    </div>
    <p>&&&&</p>
    <p>!!!!</p>


    <div class="am-page-result-button">
        <button class="am-button buttonText" id="close" type="button">Close
        </button>
    </div>
</div>
</body>

                close.setAttribute('am-mode', 'dark');
            } else {
                close.setAttribute('am-mode', 'white');
            }
            close.addEventListener('click', function () {
                window.AlipayJSBridge && AlipayJSBridge.call('popWindow');
            });
            close.innerHTML = urlParams.get('closeButtonText');
        }
    });

    if (layoutDirection === 'RTL') {
        document.documentElement.setAttribute('dir', 'rtl');
        imgNode.style = `transform: scaleX(-1)`;
    }

    window.H5ISLOADERRORHTML = true;

    function call() {
        var a = arguments,
            fn = function () {
                window.AlipayJSBridge.call.apply(null, a);
            };

        window.AlipayJSBridge ? fn() : document.addEventListener('AlipayJSBridgeReady', fn, false);
    }
    call("setTitle", { title: urlParams.get('loadingFailText') });

    //监听theme值，做页面主题切换
    document.addEventListener('themeChange', function (data) {
        //data:{"isTrusted":false,"syncJsApis":[],"theme":"dark","clientId":"native_1726225522930"}
        close = document.querySelector('#close');
        if (data?.data?.theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            if (close) {
                // 监听theme值, 设置 am-mode 属性， 设置暗黑模式
                close.setAttribute('am-mode', 'dark');
            }
        } else {
            document.documentElement.setAttribute('data-theme', 'light');

            if (close) {
                // 监听theme值, 设置 am-mode 属性， 设置明亮模式
                close.setAttribute('am-mode', 'white');
            }
        }
        // 当页面加载完毕，将透明度设置为1，页面显示
        document.body.style.opacity = 1;
    })

    document.addEventListener("back", function (e) {
        e.preventDefault();
        if (window.history.length > 2) {
            window.history.go(-2);
            return false;
        } else {
            AlipayJSBridge.call('popWindow');
        }
    });
</script>
