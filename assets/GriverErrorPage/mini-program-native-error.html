<!DOCTYPE html>

<head>
    <meta charset="utf-8" />
    <meta content="telephone=no, email=no" name="format-detection" />
    <meta content="width=device-width, initial-scale=0.5, maximum-scale=0.5, minimum-scale=0.5, user-scalable=no"
          name="viewport" />
    <script> document.title = '\u200b'</script>
    <script>
        (function (baseFontSize, fontscale) {
            'use strict';

            var _baseFontSize = baseFontSize || 100;
            var _fontscale = fontscale || 1;

            var win = window;
            var doc = win.document;
            var ua = navigator.userAgent;
            var matches = ua.match(/Android[\S\s]+AppleWebkit\/(\d{3})/i);
            var UCversion = ua.match(/U3\/((\d+|\.){5,})/i);
            var isUCHd = UCversion && parseInt(UCversion[1].split('.').join(''), 10) >= 80;
            var isIos = navigator.appVersion.match(/(iphone|ipad|ipod)/gi);
            var dpr = win.devicePixelRatio || 1;
            if (!isIos && !(matches && matches[1] > 534) && !isUCHd) {
                // disable HD, set dpr 1 if not iOS or not > Android4.3 or not UC core
                dpr = 1;
            }
            var scale = 1 / dpr;

            var metaEl = doc.querySelector('meta[name="viewport"]');
            if (!metaEl) {
                metaEl = doc.createElement('meta');
                metaEl.setAttribute('name', 'viewport');
                doc.head.appendChild(metaEl);
            }
            metaEl.setAttribute('content', 'width=device-width,user-scalable=no,initial-scale=' + scale + ',maximum-scale=' + scale + ',minimum-scale=' + scale);
            doc.documentElement.style.fontSize = _baseFontSize / 2 * dpr * _fontscale + 'px';
        })(100, 1);

    </script>
    <style type="text/css">
        body {
            transition: opacity 1s ease-out;
            /* 设置透明度变化的过渡效果 */
            opacity: 0;
            /* 初始透明度为0 */
            background-color: transparent;
        }

        /* 暗黑模式样式 */
        [data-theme='dark'] body {
            background-color: #101314;
            /* 暗黑模式背景色 */
            color: #ffffff;
            /* 暗黑模式文字色 */
        }

        /* 明亮模式样式 */
        [data-theme='light'] body {
            background-color: #FFF;
            /* 明亮模式背景色 */
            color: #000000;
            /* 明亮模式文字色 */
        }

        .error-img {
            width: 2.5rem;
            height: 2.5rem;
            margin: 1.2rem auto 0 auto;
        }

        .error-msg {
            font-size: .3rem;
            font-weight: 400;
            text-align: center;
            margin: .3rem auto;
        }

        /* 暗黑模式样式 */
        [data-theme='dark'] .error-msg {
            color: #ffffff;
        }

        [data-theme='light'] .error-msg {
            color: #101314;
        }
    </style>
</head>

    });

    //监听theme值，做页面主题切换

        //data:{"isTrusted":false,"syncJsApis":[],"data": {"theme":"dark"},"clientId":"native_1726225522930"}
        if (data?.data?.theme === 'dark') {
